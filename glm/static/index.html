<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Live portfolio generated from a GitHub profile">
  <meta name="color-scheme" content="dark light">
  <title>GitHub Portfolio</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script>
    // Apply the stored theme before first paint to avoid a flash.
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var dark = stored
          ? stored === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) { /* localStorage unavailable, keep dark */ }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#repos">Skip to repositories</a>

  <header class="topbar">
    <a class="brand" href="/" aria-label="Home">
      <svg class="brand-mark" viewBox="0 0 16 16" width="22" height="22" aria-hidden="true" fill="currentColor">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
      </svg>
      <span class="brand-name">portfolio<span class="brand-accent">.live</span></span>
    </a>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="true" title="Toggle color theme">
      <span class="theme-icon theme-icon-moon" aria-hidden="true">☾</span>
      <span class="theme-icon theme-icon-sun" aria-hidden="true">☀</span>
      <span class="visually-hidden">Toggle dark mode</span>
    </button>
  </header>

  <main class="container">
    <!-- Profile -->
    <section id="profile" class="profile-card" aria-label="GitHub profile" aria-busy="true">
      <div class="skeleton profile-skeleton">
        <div class="profile-skeleton-top">
          <div class="skeleton-block avatar-skeleton"></div>
          <div class="profile-skeleton-lines">
            <div class="skeleton-line w-60"></div>
            <div class="skeleton-line w-40"></div>
            <div class="skeleton-line w-80"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Language stats -->
    <section id="stats" class="stats-card" aria-label="Language statistics">
      <h2 class="section-title"><span aria-hidden="true">▚</span> Languages</h2>
      <div id="lang-chart" class="lang-chart" aria-live="polite">
        <div class="skeleton-line w-100"></div>
        <div class="skeleton-line w-80"></div>
        <div class="skeleton-line w-60"></div>
        <div class="skeleton-line w-90"></div>
      </div>
      <p id="lang-empty" class="empty-hint hidden">No language data yet.</p>
    </section>

    <!-- Repositories -->
    <section id="repos" aria-label="Repositories">
      <h2 class="section-title"><span aria-hidden="true">◈</span> Repositories
        <span id="repo-count" class="section-count" aria-live="polite"></span>
      </h2>

      <form id="controls" class="controls" role="search" onsubmit="return false">
        <div class="control control-search">
          <label for="search" class="visually-hidden">Search repositories</label>
          <input id="search" type="search" placeholder="Search name, description, topic…" autocomplete="off" spellcheck="false">
        </div>
        <div class="control">
          <label class="visually-hidden" for="lang-filter">Filter by language</label>
          <select id="lang-filter" aria-label="Filter by language">
            <option value="">All languages</option>
          </select>
        </div>
        <div class="control">
          <label class="visually-hidden" for="topic-filter">Filter by topic</label>
          <select id="topic-filter" aria-label="Filter by topic">
            <option value="">All topics</option>
          </select>
        </div>
        <div class="control">
          <label class="visually-hidden" for="sort">Sort by</label>
          <select id="sort" aria-label="Sort repositories">
            <option value="updated:desc">Recently updated</option>
            <option value="stars:desc">Most stars</option>
            <option value="name:asc">Name A–Z</option>
            <option value="name:desc">Name Z–A</option>
          </select>
        </div>
      </form>

      <div id="error-banner" class="error-banner hidden" role="alert">
        <p id="error-text"></p>
        <button id="retry-btn" class="btn" type="button">Retry</button>
      </div>

      <p id="pending-hint" class="pending-hint">Loading repositories for the first time…</p>
      <ul id="repo-list" class="repo-list" aria-live="polite">
        <li class="repo-card skeleton-card" aria-hidden="true"></li>
        <li class="repo-card skeleton-card" aria-hidden="true"></li>
        <li class="repo-card skeleton-card" aria-hidden="true"></li>
        <li class="repo-card skeleton-card" aria-hidden="true"></li>
        <li class="repo-card skeleton-card" aria-hidden="true"></li>
        <li class="repo-card skeleton-card" aria-hidden="true"></li>
      </ul>

      <p id="empty-state" class="empty-state hidden">
        <span class="empty-glyph" aria-hidden="true">⌀</span>
        No repositories match the current filters.
      </p>
    </section>
  </main>

  <footer class="footer">
    <p>
      <span id="updated-at"></span>
      · data from the GitHub API · new repos appear automatically
    </p>
  </footer>

  <script src="/assets/app.js" defer></script>
</body>
</html>
