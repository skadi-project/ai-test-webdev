<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>GitHub Portfolio</title><link rel="stylesheet" href="/style.css"></head><body><header class="site-header"><button id="theme" type="button" aria-label="Toggle color theme">☼ <span>Theme</span></button><div id="profile" class="profile skeleton" aria-live="polite"><div class="avatar"></div><div><h1>Loading profile…</h1><p>Fetching GitHub profile</p></div></div></header><main><section class="toolbar"><label>Search <input id="q" type="search" autocomplete="off" placeholder="Name or description"></label><label>Language <select id="language"><option value="">All languages</option></select></label><label>Sort <select id="sort"><option value="stars">Stars</option><option value="updated">Updated</option><option value="name">Name</option></select></label><button id="load" type="button">Refresh view</button></section><p id="status" role="status">Loading repositories…</p><section id="repos" aria-live="polite"></section><section><h2>Languages</h2><canvas id="languages" width="600" height="240"></canvas></section></main><script src="/app.js"></script></body></html>
