services:
  portfolio:
    build: .
    env_file: .env
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - portfolio-cache:/data/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  portfolio-cache:
