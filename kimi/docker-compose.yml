services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: github-portfolio:latest
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8080
      CACHE_PATH: /data/cache.json
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - portfolio-cache:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  portfolio-cache:
